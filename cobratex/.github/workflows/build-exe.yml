name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install desktop deps (Electron + embedded PostgreSQL + backend runtime libs)
        working-directory: desktop-offline
        run: npm install
      - name: Build payload and package
        working-directory: desktop-offline
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: CobraTex-windows
          path: desktop-offline/release/*.exe
