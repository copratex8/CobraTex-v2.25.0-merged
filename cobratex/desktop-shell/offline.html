<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>لا يوجد اتصال</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D1B2A;color:#fff;font-family:Segoe UI,Tahoma,Arial,sans-serif;text-align:center}
  .box{max-width:420px;padding:32px}
  h1{font-size:1.4rem;margin:0 0 12px}
  p{color:#b8c4d6;line-height:1.8;margin:0 0 24px}
  button{background:#f5b800;border:0;border-radius:10px;padding:10px 28px;font-weight:700;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <h1>تعذّر الاتصال بالخادم</h1>
    <p>تحقق من اتصالك بالإنترنت ثم أعد المحاولة. لا تُحفظ أي عملية حتى يعود الاتصال.</p>
    <button id="retry">إعادة المحاولة</button>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      var u = new URLSearchParams(location.search).get('u');
      if (u && /^https:\/\//.test(u)) location.href = u;
    });
  </script>
</body>
</html>
